name: Scrape ATRBPN

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Run scraper
        run: python fetch_berita.py
